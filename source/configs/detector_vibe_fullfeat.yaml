# Detector comparison on the FULL pipeline features - vibe.
# Same as group_i_adaptive_mog2 (distortion-aware preprocessing, 221-dim features,
# same tracker) except the background model. Compare with group_i_adaptive_mog2
# (adaptive MOG2) and ablation_4_full_pipeline_fixed_mog2 (fixed MOG2).
# Answers SACAIR Reviewer 1: is the gain generic adaptivity or specific to this method?
extends: group_i_adaptive_mog2.yaml

experiment:
  name: detector_vibe_fullfeat
  description: Group I with vibe as the only change.
  group: DET-vibe-full

detection:
  type: vibe
  vibe:
    n_samples: 20
    radius: 20
    min_matches: 2
    subsampling: 16
