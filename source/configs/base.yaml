experiment:
  name: default
  description: ""
  group: A
  seed: 42
  n_workers: 1         # video-processing processes (a number, or auto = all cores but one)

paths:
  data_dir: data
  video_dir: data/surveillanceVideosDataset/surveillanceVideos
  gt_dir: data/surveillanceVideosDataset/surveillanceVideosGT
  dataset_excel: data/datasetInfo.xlsx
  model_dir: models
  plots_dir: plots
  experiments_dir: experiments
  outputs_dir: outputs

dataset:
  activity_labels:
    - LPP
    - PO
    - PW
    - PPP
    - RK
    - FG
    - PR
    - WL
  distortion_types:
    - Pri
    - Exp
    - Fo
    - ExFo
  n_random_videos_per_group: 5

preprocessing:
  type: standard
  frame_resize:
    - 640
    - 480
  blur_kernel:
    - 5
    - 5
  blur_sigma: 0
  # Key name MUST be distortion_aware_params — matches build_preprocessor() in run.py.
  # Child configs that set type: distortion_aware inherit these values automatically.
  distortion_aware_params:
    blur_threshold: 100.0
    exposure_low: 60.0
    exposure_high: 195.0
    enhancement_for_blur: unsharp_mask
    enhancement_for_exposure: clahe
    unsharp_sigma: 2.0
    unsharp_strength: 1.5
    clahe_clip_limit: 2.0
    clahe_tile_grid:
      - 8
      - 8
    bilateral_d: 9
    bilateral_sigma_color: 75
    bilateral_sigma_space: 75
    use_multi_metric: true

detection:
  type: mog2
  mog2:
    history: 20
    # 16 = 4-sigma, the Zivkovic & van der Heijden (2006) / OpenCV default.
    # Every result before this change used 25. Justified by scripts/mog2_threshold_sweep.py.
    var_threshold: 16
    detect_shadows: false
  # Settings of the adaptive MOG2 detector. Defined once here so every adaptive config
  # shares the same values; they are ignored unless detection.type is adaptive_mog2.
  adaptive_mog2:
    relaxed_var_threshold: 10.0   # tau_r: threshold under full relaxation
    quality_threshold: 0.4        # q: below this combined score, adapt
    mask_weight: 0.7              # w: weight of mask quality vs track quality
    threshold_floor: 8.0          # tau_min: never go below this threshold
    ema_alpha: 0.8                # smoothing of the per-frame track-quality signal
    min_track_len: 5              # mean track length (frames) that counts as a fully reliable track
    update_once: true             # false = old behaviour (second model update on the retry)
  morphology:
    close_iter: 2
    open_iter: 1
  min_contour_area: 500
  ground_truth:
    fallback_to_mog2: true

tracking:
  type: iou_hungarian
  max_disappeared: 30
  max_trajectory_len: 300
  # 15 is relaxed from 30 — distortion-heavy videos produce shorter tracks.
  # Group E (GT upper bound) justifies this: GT tracks are consistently longer,
  # so 30 is appropriate there but 15 is needed for MOG2-based groups A–D.
  min_trajectory_len: 15
  iou_hungarian:
    iou_threshold: 0.3

optical_flow:
  lk_win_size:
    - 15
    - 15
  lk_max_level: 2
  lk_criteria_eps: 0.03
  lk_criteria_count: 10
  max_corners: 200
  corner_quality: 0.3
  corner_min_dist: 7

features:
  modules:
    - trajectory
  aggregation:
    - mean
    - max
    - std
  # Constructor arguments of individual feature modules (used only if the module is enabled).
  module_params:
    wavelet:
      wavelet: db4              # mother wavelet
      level: 3                  # decomposition depth
    interaction:
      proximity_threshold: 100.0   # pixels: two tracks closer than this count as interacting
  # Multi-family mode only (features.enable_multifamily):
  global_flow_step: 5           # compare every 5th frame for the global optical-flow descriptor
  appearance_frame_count: 30    # about this many evenly spaced frames feed the appearance descriptor

# Default model set — all classical + boosting models.
# Group-specific configs override this list when they restrict to a subset.
models:
  active:
    - name: random_forest_sklearn
      params:
        n_estimators: 200
        max_depth: null
        class_weight: balanced
    - name: svm_rbf
      params:
        C: 10
        gamma: scale
        class_weight: balanced
    - name: knn
      params:
        n_neighbors: 5
        metric: euclidean
    - name: random_forest_custom
      params:
        n_trees: 200
        max_depth: 10
        min_samples_split: 2
    - name: lightgbm
      params:
        n_estimators: 200
        max_depth: 6
        learning_rate: 0.1
        num_leaves: 31
        class_weight: balanced
    - name: xgboost
      params:
        n_estimators: 200
        max_depth: 6
        learning_rate: 0.1
    - name: mlp                    # neural network on the same handcrafted features
      params:
        hidden_layer_sizes: [128, 64]
        alpha: 0.001
        max_iter: 300

training:
  cv_folds: 5          # stratified k-fold
  cv_repeats: 1        # repeat the whole cross-validation with new shuffles (3-5 gives steadier numbers)
  n_bootstrap: 1000    # resamples for the 95% confidence intervals
  n_jobs: 1            # parallel CV folds (-1 = all cores)
  min_per_class: 3
  # The neural groups (C, D) still use a train / validation / test split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  stratify: true

# How class imbalance is handled. Everything here is applied inside the
# training folds only; test folds are never resampled or augmented.
imbalance:
  class_weight: balanced     # balanced | none   (how much each class counts in the loss)
  resampling: none           # none | random_over | smote | borderline_smote | adasyn |
                             # smote_tomek | smote_enn | random_under | gaussian_noise | mixup
  sampling_ratio: 1.0        # 1.0 = fully balanced; 0.5 = minority up to half the majority
  k_neighbors: 5             # for the SMOTE family (reduced automatically for small classes)
  params: {}                 # gaussian_noise: {noise_std: 0.1}   mixup: {alpha: 0.4}

targets:
  - activity
  - distortion

data_path: tabular

# Clip settings — used only when data_path: clip (Group C neural pipeline).
clip:
  clip_len: 16
  frame_size:
    - 112
    - 112
  sampling: uniform

embedding:
  backbone: resnet18_2d
  pretrained: false
  embedding_dim: 512
  pooling: mean

smoothing:
  enabled: false
  method: majority_vote   # majority_vote | ema
  ema_alpha: 0.7
