extends: base.yaml

experiment:
  name: group_a_classical_baseline
  description: >
    Classical CV pipeline: MOG2 detection + IoU+Hungarian tracking +
    trajectory features only + all classical/boosting models.
    BASELINE group — standard preprocessing, minimal feature set.
    All other groups are compared against this.
  group: A

# Standard preprocessing inherited from base (type: standard).

tracking:
  type: iou_hungarian
  iou_hungarian:
    iou_threshold: 0.3
  # max_disappeared, max/min_trajectory_len inherited from base.

features:
  modules:
    - trajectory   # trajectory-only is the classical baseline

# All models inherited from base.yaml (RF, SVM, KNN, RF-custom, LGB, XGB).
